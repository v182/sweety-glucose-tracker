name: Sweety checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: sweety
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: sweety_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweety -d sweety_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sweety:ci-test-only@localhost:5432/sweety_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
  docker-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-database-only
      DEMO_EMAIL: demo@sweety.local
      DEMO_PASSWORD: ci-demo-only-password
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build and start PostgreSQL and the production app
        run: docker compose --env-file .env.example up --build --wait --wait-timeout 180
      - name: Create the synthetic demo
        run: docker compose --env-file .env.example exec -T app npm run db:seed
      - name: Exercise the production app through HTTP
        run: npm run smoke
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color
      - name: Stop disposable CI services
        if: always()
        run: docker compose --env-file .env.example down -v
