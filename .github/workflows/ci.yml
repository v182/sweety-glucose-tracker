name: Sweety checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: sweety
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: sweety_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweety -d sweety_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sweety:ci-test-only@localhost:5432/sweety_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
